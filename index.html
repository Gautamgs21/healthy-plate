<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healthy Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f3;
  --surface:#ffffff;
  --surface-2:#eef1eb;
  --surface-3:#e4e9df;
  --ink:#111914;
  --ink-2:#4a584e;
  --mute:#748278;
  --line:#dfe4db;
  --line-strong:#cbd3c5;
  --accent:#0f6243;
  --accent-hover:#0a4c33;
  --accent-fg:#ffffff;
  --accent-soft:#e6f2ec;
  --amber:#b45309;
  --amber-soft:#fef3c7;
  --amber-line:#f59e0b;
  --danger:#b91c1c;
  --danger-soft:#fee2e2;
  --info:#1d4ed8;
  --info-soft:#eff6ff;
  --shadow-sm:0 1px 2px rgba(17,25,20,.04);
  --shadow-md:0 8px 24px rgba(17,25,20,.08);
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --glass:rgba(245,246,243,.86);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c100e;
    --surface:#141a17;
    --surface-2:#1b231f;
    --surface-3:#242e28;
    --ink:#edf2ee;
    --ink-2:#b0bdb4;
    --mute:#7e8d83;
    --line:#252f29;
    --line-strong:#35433a;
    --accent:#2bb67d;
    --accent-hover:#34d399;
    --accent-fg:#071911;
    --accent-soft:rgba(43,182,125,.14);
    --amber:#f59e0b;
    --amber-soft:rgba(245,158,11,.14);
    --amber-line:#d97706;
    --danger:#f87171;
    --danger-soft:rgba(248,113,113,.14);
    --info:#60a5fa;
    --info-soft:rgba(96,165,250,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
    --shadow-md:0 12px 32px rgba(0,0,0,.45);
    --glass:rgba(12,16,14,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c100e;
  --surface:#141a17;
  --surface-2:#1b231f;
  --surface-3:#242e28;
  --ink:#edf2ee;
  --ink-2:#b0bdb4;
  --mute:#7e8d83;
  --line:#252f29;
  --line-strong:#35433a;
  --accent:#2bb67d;
  --accent-hover:#34d399;
  --accent-fg:#071911;
  --accent-soft:rgba(43,182,125,.14);
  --amber:#f59e0b;
  --amber-soft:rgba(245,158,11,.14);
  --amber-line:#d97706;
  --danger:#f87171;
  --danger-soft:rgba(248,113,113,.14);
  --info:#60a5fa;
  --info-soft:rgba(96,165,250,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 12px 32px rgba(0,0,0,.45);
  --glass:rgba(12,16,14,.86);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 14.5px/1.55 "Inter","Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-feature-settings:"cv02","cv03","cv04","cv11";
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,border-color .15s,color .15s,transform .1s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* App Shell */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-in{
  max-width:920px;margin:0 auto;
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;flex:none;
}
.brand-txt{min-width:0}
.brand-txt h1{
  margin:0;font-size:1.12rem;font-weight:700;letter-spacing:-.02em;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-txt p{
  margin:2px 0 0;font-size:.76rem;color:var(--mute);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.kcal-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 9px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:.73rem;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.seg-lang{
  display:inline-flex;padding:2px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);
}
.seg-lang span{
  padding:4px 8px;border-radius:7px;font-size:.73rem;font-weight:600;
  color:var(--mute);transition:all .15s;
}
.seg-lang span.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);padding:0;
}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}

/* Workspace */
.shell{max-width:920px;margin:0 auto;padding:16px 16px calc(86px + env(safe-area-inset-bottom,0px))}

/* Navigation Tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
}
.tabs button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;border-radius:10px;padding:6px 2px;min-height:50px;
  color:var(--mute);font-size:.69rem;font-weight:600;letter-spacing:.01em;
}
.tabs button svg{width:19px;height:19px;stroke-width:1.85}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
@media (min-width:768px){
  .shell{padding:18px 24px 48px}
  .tabs{
    position:static;background:var(--surface);backdrop-filter:none;
    border:1px solid var(--line);border-radius:12px;padding:4px;
    margin-bottom:16px;box-shadow:var(--shadow-sm);gap:4px;
  }
  .tabs button{
    flex-direction:row;gap:8px;min-height:38px;padding:0 12px;font-size:.82rem;border-radius:8px;
  }
  .tabs button svg{width:16px;height:16px}
}

/* Weekday Strip */
.days{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  margin-bottom:14px;
}
.days button{
  position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 4px;font-size:.78rem;font-weight:600;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:var(--shadow-sm);
}
.days button:hover{border-color:var(--line-strong);color:var(--ink)}
.days button.on{
  background:var(--accent);border-color:var(--accent);color:var(--accent-fg);
}
.days button.today::after{
  content:"";width:5px;height:5px;border-radius:99px;background:var(--amber-line);
}
.days button.on.today::after{background:var(--accent-fg)}

/* Cards & Surfaces */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.card-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;
}
.card-hd h2,.card h3{
  margin:0;font-size:.96rem;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;color:var(--ink);
}
.card-hd .meta{font-size:.76rem;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}

.banner{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:11px 13px;margin-bottom:14px;
  font-size:.84rem;color:var(--ink-2);
}
.banner svg{flex:none;margin-top:2px;color:var(--accent)}
.banner.amber{background:var(--amber-soft);border-color:rgba(217,119,6,.28);color:var(--ink)}
.banner.amber svg{color:var(--amber)}

/* Household / Family Panel */
.fam-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-md);margin-bottom:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.fam-card summary{
  list-style:none;cursor:pointer;padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.84rem;font-weight:600;color:var(--ink);
}
.fam-card summary::-webkit-details-marker{display:none}
.fam-sum-l{display:flex;align-items:center;gap:8px;min-width:0}
.fam-sum-l svg{color:var(--accent);flex:none}
.fam-chev{color:var(--mute);transition:transform .2s;flex:none}
.fam-card[open] .fam-chev{transform:rotate(180deg)}
.fam-body{padding:4px 14px 14px;border-top:1px solid var(--line)}
.fam-grid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:680px){.fam-grid{grid-template-columns:1fr 1fr;gap:0 24px}}

/* Stepper & Inventory Rows */
.row-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-top:1px solid var(--line);
}
.row-item:first-child{border-top:0}
.row-info{flex:1;min-width:0}
.row-title{font-weight:600;font-size:.88rem;color:var(--ink);display:flex;align-items:center;gap:7px}
.row-sub{font-size:.76rem;color:var(--mute);margin-top:2px}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font-weight:600;font-size:1rem;display:grid;place-items:center;padding:0;
}
.stp button:hover{background:var(--surface-3);border-color:var(--line-strong)}
.stp input{
  width:56px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);text-align:center;font-size:.86rem;font-weight:600;
  font-variant-numeric:tabular-nums;padding:0 4px;
}
.unit-btn{
  min-width:34px;height:32px;padding:0 7px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--accent);
  font-size:.75rem;font-weight:700;
}
.unit-btn:disabled{opacity:0;pointer-events:none;border-color:transparent}

.dot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--line-strong)}
.dot.ok{background:var(--accent)}
.dot.low{background:var(--amber-line)}
.dot.zero{background:var(--danger)}

/* Grocery Checklists */
.shop-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.shop-grid{grid-template-columns:repeat(2,1fr);align-items:start}}
.shop-grid .card{margin-bottom:0}
label.chk-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 6px;margin:0 -6px;border-radius:8px;
  border-top:1px solid var(--line);cursor:pointer;
  transition:background-color .12s;
}
label.chk-row:first-of-type{border-top:0}
label.chk-row:hover{background:var(--surface-2)}
label.chk-row input{
  appearance:none;-webkit-appearance:none;
  width:18px;height:18px;border-radius:5px;flex:none;
  border:1.5px solid var(--line-strong);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;transition:all .15s;
}
label.chk-row input:checked{background:var(--accent);border-color:var(--accent)}
label.chk-row input:checked::after{
  content:"";width:5px;height:9px;border:solid var(--accent-fg);border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);
}
label.chk-row input:checked + .chk-lbl{text-decoration:line-through;color:var(--mute)}
.chk-lbl{flex:1;min-width:0;font-size:.88rem;font-weight:500}
.chk-qty{
  font-size:.76rem;font-weight:600;color:var(--ink-2);
  background:var(--surface-2);padding:2px 8px;border-radius:6px;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}

/* Buy Card & Price Comparison */
.buy-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.buy-total{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.buy-status{
  font-size:.78rem;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:10px;
}
details.buy-item{border-top:1px solid var(--line)}
details.buy-item:first-of-type{border-top:0}
details.buy-item summary{
  list-style:none;cursor:pointer;padding:10px 0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.87rem;font-weight:600;
}
details.buy-item summary::-webkit-details-marker{display:none}
.buy-r{display:flex;align-items:center;gap:8px;flex:none;font-variant-numeric:tabular-nums}
.buy-q{color:var(--ink-2);font-weight:500;font-size:.8rem}
.buy-p{
  background:var(--accent-soft);color:var(--accent);
  padding:2px 8px;border-radius:6px;font-weight:700;font-size:.8rem;
}
.buy-detail{padding:0 0 12px;font-size:.8rem;color:var(--ink-2)}
.slot-lbl{
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--mute);margin:10px 0 4px;
}
.mt{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:4px 0;
  background:var(--surface);font-size:.8rem;
}
.mt.on{border-color:var(--accent);background:var(--accent-soft)}
.mtb{flex:1;text-align:left;background:none;border:0;padding:0;line-height:1.35}
.mt a{
  color:var(--mute);text-decoration:none;padding:4px 6px;border-radius:6px;
  display:grid;place-items:center;
}
.mt a:hover{background:var(--surface-2);color:var(--ink)}
.src-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}

/* Meals Timeline */
.timeline{display:flex;flex-direction:column}
.meal-row{
  display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);
}
.meal-row:first-child{border-top:0;padding-top:4px}
.meal-row:last-child{padding-bottom:4px}
.meal-time-col{flex:0 0 74px;display:flex;flex-direction:column;gap:2px}
.meal-clock{font-weight:700;font-size:.84rem;color:var(--accent);font-variant-numeric:tabular-nums}
.meal-slot-name{font-size:.7rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.meal-body{flex:1;min-width:0}
.meal-desc{font-size:.92rem;font-weight:500;color:var(--ink);line-height:1.45}
.prep-btn{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font-size:.77rem;font-weight:600;
}
.prep-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.prep-btn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.prep-btn.skip{background:var(--surface);border-style:dashed;color:var(--mute)}

/* Serving Guide Table */
.guide-table{width:100%;border-collapse:collapse;font-size:.83rem}
.guide-table th{
  text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--mute);padding:0 6px 8px 0;border-bottom:1px solid var(--line);
}
.guide-table td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.guide-table tr:last-child td{border-bottom:0}
.guide-table td:first-child{font-weight:600;color:var(--ink)}

/* Cook Recipes */
.cook-bar{display:flex;justify-content:flex-end;margin-bottom:10px}
.btn-ghost{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--ink-2);
}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
details.rec-item{border-top:1px solid var(--line)}
details.rec-item:first-of-type{border-top:0}
details.rec-item summary{
  list-style:none;cursor:pointer;padding:11px 0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-weight:600;font-size:.91rem;color:var(--ink);
}
details.rec-item summary::-webkit-details-marker{display:none}
details.rec-item[open] summary .rec-chev{transform:rotate(180deg)}
.rec-chev{color:var(--mute);transition:transform .18s;flex:none}
.rec-body{padding:0 0 14px}
.rec-meta{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;
}
.rec-ing{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:.84rem;margin-bottom:10px;color:var(--ink-2);
}
.rec-ing b{color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;counter-reset:step}
.steps li{
  counter-increment:step;display:flex;gap:10px;margin-bottom:8px;
  font-size:.86rem;color:var(--ink-2);line-height:1.5;
}
.steps li::before{
  content:counter(step);flex:none;width:20px;height:20px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);
  font-size:.72rem;font-weight:700;display:grid;place-items:center;margin-top:2px;
  font-variant-numeric:tabular-nums;
}

/* Stock Tools */
.stock-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.search-wrap{position:relative;flex:1 1 200px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search-in{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);padding:0 12px 0 34px;font-size:.86rem;
}
.btn-danger-outline{
  height:38px;padding:0 14px;border-radius:10px;
  border:1px solid var(--danger);background:transparent;color:var(--danger);
  font-size:.8rem;font-weight:600;
}
.btn-danger-outline.arm{background:var(--danger);color:#fff}

/* Health Dashboard */
.health-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:740px){.health-grid{grid-template-columns:1fr 1fr;align-items:start}}
.health-grid .card{margin-bottom:0}
.health-full{grid-column:1 / -1}
.metric-big{font-size:1.65rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric-sub{font-size:.84rem;color:var(--mute);font-weight:500}
.prog-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 12px}
.prog-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease}
.form-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ctrl{
  height:36px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);padding:0 10px;font-size:.84rem;flex:1 1 110px;min-width:0;
}
.btn-primary{
  height:36px;padding:0 14px;border-radius:9px;border:0;
  background:var(--accent);color:var(--accent-fg);font-size:.82rem;font-weight:600;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-del{
  background:none;border:0;color:var(--mute);width:30px;height:30px;border-radius:7px;
  display:grid;place-items:center;font-size:1.1rem;padding:0;
}
.btn-del:hover{background:var(--danger-soft);color:var(--danger)}
.med-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 0;border-top:1px solid var(--line);
}
.med-row label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:.87rem;font-weight:500}
.med-row input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.med-row input:checked + span{text-decoration:line-through;color:var(--mute)}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.wk-col{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 4px;text-align:center;font-size:.72rem;color:var(--mute);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;
}
.wk-col strong{color:var(--ink);font-size:.82rem}
.wk-mini-bar{width:100%;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.wk-mini-bar i{display:block;height:100%;background:var(--accent)}

/* Modal / Sheet */
#ov{
  position:fixed;inset:0;z-index:60;
  background:rgba(10,14,12,.52);
  backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
}
@media (min-width:640px){#ov{align-items:center;padding:16px}}
.sheet{
  background:var(--surface);width:100%;max-width:540px;max-height:86vh;overflow:auto;
  border-radius:18px 18px 0 0;border:1px solid var(--line);
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow-md);
}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-size:1.05rem}
.sheet-sub{margin:0 0 12px;font-size:.83rem;color:var(--mute)}
.sheet label.chk-row input:checked + .chk-lbl{text-decoration:none;color:var(--ink)}

/* Toast & Footer */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:.82rem;font-weight:600;
  box-shadow:var(--shadow-md);white-space:nowrap;animation:pop .2s ease-out;
}
@media (min-width:768px){.toast{bottom:24px}}
@keyframes pop{from{transform:translateX(-50%) translateY(8px);opacity:0}}
.foot{
  max-width:920px;margin:20px auto 0;padding:12px 0 0;
  border-top:1px solid var(--line);font-size:.76rem;color:var(--mute);line-height:1.5;
}

/* Account, sync, health tests, login */
#acct{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.52);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){#acct{align-items:center;padding:16px}}
#acctBtn{position:relative}
#acctBtn::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:99px;background:var(--mute);border:2px solid var(--surface-2);box-sizing:content-box}
body[data-sync="ok"] #acctBtn::after{background:var(--accent)}
body[data-sync="saving"] #acctBtn::after{background:var(--amber-line)}
body[data-sync="error"] #acctBtn::after{background:var(--danger)}
#auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-md)}
.auth-card h2{margin:12px 0 2px;font-size:1.25rem;letter-spacing:-.02em}
.auth-card p.sub{margin:0 0 14px;color:var(--mute);font-size:.85rem}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.auth-tabs button{border:0;background:none;border-radius:8px;padding:7px;font-weight:600;font-size:.84rem;color:var(--mute)}
.auth-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;font-size:.88rem;font-weight:400;width:100%}
.fld-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fld-grid .wide{grid-column:1/-1}
.auth-err{min-height:1.2em;margin:0 0 8px;color:var(--danger);font-size:.82rem}
.btn-block{width:100%;height:42px}
.lab-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lab-list{max-height:320px;overflow:auto;margin-top:6px}

/* ===== Dashboard, charts, health tests (part 1) ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--mute)}
.bad-t{color:var(--danger);font-weight:600}
small.ref{font-weight:400;color:var(--mute);font-size:.72rem}
.fld textarea{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 10px;font:inherit;font-size:.88rem;font-weight:400;width:100%;resize:vertical;color:var(--ink)}
.fld input,.fld select,.fld textarea{color:var(--ink)}
.dov{position:fixed;inset:0;z-index:62;background:rgba(10,14,12,.52);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.dov{align-items:center;padding:16px}}
.dov .sheet{max-height:90vh}
.dov.big .sheet.hm{max-width:none;width:100%;height:92vh;max-height:92vh;border-radius:18px 18px 0 0;padding:16px}
@media (min-width:900px){.dov.big .sheet.hm{width:75vw;height:75vh;max-height:75vh;border-radius:16px;padding:20px}}
.hm-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hm-hd h3{margin:0}
.hm-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.hm-grid{grid-template-columns:1fr 1fr}}
.hc{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;background:var(--surface);min-width:0}
.hc h4{margin:0 0 8px;font-size:.92rem}
.hc .fld{margin-bottom:6px}
.hc-meta{font-size:.74rem;color:var(--mute);margin-bottom:8px}
.hc-ref{font-size:.74rem;color:var(--mute);margin:4px 0 8px}
.chart{position:relative}
.ch-svg{width:100%;height:auto;display:block;touch-action:pan-y}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--mute);font-size:11px;font-family:inherit}
.ch-band{fill:var(--accent-soft)}
.ch-refl{fill:var(--accent)}
.ch-target{stroke:var(--amber-line);stroke-width:1.5;stroke-dasharray:6 4}
.ch-tl{fill:var(--amber)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.ch-line.s2{stroke:var(--info)}
.ch-pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.25}
.ch-pt.s2{stroke:var(--info)}
.ch-pt.bad{fill:var(--danger);stroke:var(--danger)}
.ch-tip{position:absolute;transform:translate(-50%,-135%);background:var(--ink);color:var(--bg);font-size:.74rem;font-weight:600;padding:4px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:2}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip-b{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:.74rem;font-weight:600}
.chip-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip-b:disabled{opacity:.5}
.seg-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.ok,.chip.st-ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.st-attn{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.st-over,.chip.st-soon{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.btn-mini{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:.74rem;font-weight:600}
.btn-mini:hover{background:var(--surface-2);color:var(--ink)}
.btn-mini.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.empty{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);background:var(--surface-2);font-size:.82rem;color:var(--ink-2);margin:6px 0 10px}
.empty span{color:var(--mute)}
.vbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.vb{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:.8rem;min-width:0}
.vb-l{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:3px}
.vb-v{font-size:.8rem}
.vb-r{margin:1px 0;font-variant-numeric:tabular-nums}
.tl{display:flex;flex-direction:column;gap:0;margin:4px 0 8px;max-height:230px;overflow:auto}
.tl-i{display:flex;gap:10px;padding:8px 0 8px 12px;border-left:2px solid var(--line-strong);font-size:.8rem;position:relative}
.tl-i::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:99px;background:var(--accent)}
.tl-i.bad{border-left-color:var(--danger)}
.tl-i.bad::before{background:var(--danger)}
.tl-d{flex:0 0 92px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-b{flex:1;min-width:0}
.tg{border-top:1px solid var(--line);padding:2px 0}
.tg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 0;font-weight:700;font-size:.88rem}
.tg>summary::-webkit-details-marker{display:none}
.tg>summary .meta{margin-left:auto;font-size:.72rem;font-weight:600;color:var(--mute)}
.tg>summary .fam-chev{flex:none}
.tg[open]>summary .fam-chev{transform:rotate(180deg)}
.tst{padding:10px 0;border-top:1px solid var(--line)}
.tst:first-of-type{border-top:0}
.tst-top{display:flex;gap:10px;align-items:flex-start}
.tst-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tst-hist{margin:8px 0 0 8px;padding-left:10px;border-left:2px solid var(--line)}
.addmed{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.addmed>summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--accent);padding:4px 0 8px}
.msub{display:block;font-size:.72rem;color:var(--mute);font-weight:400}
.med-row.off{opacity:.8}
.dash-hi{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.dash-hi h2{margin:0;font-size:1.25rem;letter-spacing:-.02em}
.dash-hi p{margin:2px 0 0;font-size:.82rem;color:var(--mute)}
.syncpill{font-size:.72rem;color:var(--mute);font-weight:600}
.sec{margin:18px 0 10px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.ev>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.ev>summary::-webkit-details-marker{display:none}
.ev[open]>summary .fam-chev{transform:rotate(180deg)}
.ev-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ev-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ev-main b{font-size:.9rem}
.ev-next{font-size:.78rem;color:var(--mute);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev[open] .ev-next{-webkit-line-clamp:unset}
.ev-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.ev-list{list-style:none;margin:0 0 10px;padding:0}
.ev-list li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:.82rem}
.ev-list li:first-child{border-top:0}
.ev-list li b{display:block;font-weight:600}
.ev-list li span{display:block;color:var(--mute);font-size:.76rem;margin-top:1px}
.ev-list li.bad b{color:var(--danger)}
.ev-list li.warn b{color:var(--amber)}
.tag{flex:none;font-style:normal;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.stat-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:768px){.stat-grid{grid-template-columns:1fr 1fr}.stat-grid .phys{grid-column:1/-1}}
.dash-card{margin-bottom:0;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.hcard .stats{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.stat-l{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.stat-v{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat-s{font-size:.72rem;color:var(--mute);margin-top:1px}
.stat.bad .stat-v{color:var(--danger)}
.stat.warn .stat-v{color:var(--amber)}
.prog{margin:6px 0 10px}
.prog-hd{display:flex;justify-content:space-between;font-size:.8rem}
.prog .prog-track{margin:6px 0 6px}
.phys-add{margin:6px 0 10px}
.hcard{cursor:pointer}
.hcard:hover{border-color:var(--line-strong)}
.hcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hc-open{display:inline-block;margin-top:4px;font-size:.82rem;font-weight:700;color:var(--accent)}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-of-type{border-top:0}
.mrow-n{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.mrow dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:0;font-size:.78rem}
.mrow dt{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.mrow dd{margin:0}
.tabs{grid-template-columns:repeat(6,1fr)}
@media (max-width:420px){.tabs button{font-size:.62rem}}
@media (min-width:768px){.tabs{grid-template-columns:repeat(6,auto);justify-content:start}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <div class="brand-txt">
        <h1 id="title">Today</h1>
        <p id="sub">Healthy Plate: Kerala diet planner</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="kcal-pill" id="kcal">1600 kcal</span>
      <button class="seg-lang" id="lang" aria-label="Language" style="border:0;background:none;padding:0">
        <span class="seg-lang"><span data-l="en">EN</span><span data-l="ml">മല</span></span>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
      <button class="icon-btn" id="acctBtn" aria-label="Profile and account"></button>
    </div>
  </div>
</header>

<main class="shell">
  <nav class="tabs" role="tablist">
    <button data-t="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></button>
    <button data-t="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Groceries</span></button>
    <button data-t="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg><span>Meals</span></button>
    <button data-t="cook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg><span>Cook</span></button>
    <button data-t="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>Stock</span></button>
    <button data-t="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>Health</span></button>
  </nav>

  <div class="days" id="days"></div>
  <div id="view"></div>

  <p class="foot">Based on your dietitian’s chart. Oats replace the dosa/puttu/chapati portion, never add to it. Check glucose as advised and confirm portions with your dietitian.</p>
</main>

<script src="shared/tests.js"></script>
<script src="shared/calc.js"></script>
<script src="js/dash.js"></script>
<script>
const D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const SVG={
  chev:'<svg class="fam-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',

  users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  fruit:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

const R={
tea:["Tea / coffee (no sugar)","150 ml water, tea or coffee, milk optional (small splash)","Boil water with tea/coffee|Strain and drink without sugar, honey or jaggery"],
idli:["Idli + sambar","Serves 1, 20 min. About 100 g fermented idli batter, a few drops of oil, 1 cup sambar","Take the batter out of the fridge 30 minutes before and stir gently with a spoon. Do not whisk; it keeps the air in.|Boil 2 cups of water in the idli steamer.|Grease 2 idli moulds with a few drops of oil and fill each about 3/4 full.|Steam on medium-high for 10 to 12 minutes. A toothpick pushed in should come out clean.|Rest 2 minutes, then lift out with a wet spoon.|Serve hot with 1 cup of sambar. Skip coconut chutney."],
sambar:["Sambar","Makes about 3 cups, enough for the day. 1/4 cup mixed dal (about 40 g), 1/2 tsp turmeric, 1/4 cup each pumpkin and drumstick pieces, 1/2 onion, 1 tomato, 1.5 tsp sambar powder, gooseberry-size tamarind, 1/2 tsp mustard, 1 dry red chilli, 6 curry leaves, 1 tsp oil, salt","Wash the dal and pressure-cook with 1 cup water and the turmeric for 3 whistles. Mash lightly.|Soak the tamarind in 1/2 cup warm water for 10 minutes, then squeeze out the pulp and discard the fibre.|Boil pumpkin, drumstick, chopped onion and tomato in 1.5 cups water with salt for 8 to 10 minutes until tender.|Add the tamarind water and sambar powder and boil 5 minutes until the raw smell goes.|Stir in the mashed dal, add hot water if too thick, and simmer 5 minutes.|Heat the oil, crackle the mustard, then add chilli and curry leaves and pour over the sambar. Finish with chopped coriander."],
salad:["Vegetable salad","Serves 1, 5 min. 1/2 cucumber, 1/2 tomato, 1 small carrot, 2 tbsp onion, juice of 1/4 lemon, salt and pepper","Wash all the vegetables well.|Slice the cucumber and tomato thin, grate the carrot and chop the onion finely.|Mix in a bowl, add lemon juice, a pinch of salt and pepper.|Eat fresh within 15 minutes. No oil, mayonnaise or dressing."],
egg:["Egg whites (2)","Serves 1, 12 min. 2 eggs, pinch of pepper and salt","Place the whole eggs in a pot, cover with water and bring to a boil.|Reduce heat and simmer 10 minutes for fully set eggs.|Move to cold water for 3 minutes, then peel.|Cut in half, remove and discard the yolks (or keep them for someone else).|Sprinkle the whites with pepper and salt. For a change, chop and stir-fry with 3 drops of oil and some onion."],
corn:["Steamed corn","Serves 1, 15 min. 1/2 cup corn kernels (or 1 small cob), salt, pepper, a squeeze of lemon","If using a cob, remove husk and silk and cut into 3 pieces; kernels need no prep.|Steam for 10 to 12 minutes until the kernels are tender but not mushy.|Measure out 1/2 cup of kernels.|Toss with a pinch of salt, pepper and lemon. No butter."],
rice:["Rice (1 cup)","Serves 1, 25 min. About 70 g raw rice (cooks to about 1 cup, 200 ml), 1 cup water, pinch of salt","Rinse the rice 3 times until the water runs mostly clear.|Soak for 15 minutes, then drain.|Bring 1 cup of water to a rolling boil, add rice and salt.|Cover and cook on the lowest heat for 12 to 15 minutes until the water is absorbed.|Switch off, rest 5 minutes without opening, then fluff with a fork.|Measure 1 cup (200 ml) onto the plate. Do not take second helpings."],
rasam:["Rasam","Serves 2, 20 min. 1 large tomato, 1/2 tsp rasam powder, 3 garlic cloves, 1/2 tsp pepper, 1/2 tsp cumin, 1/4 cup cooked dal water, 1/2 tsp mustard, 5 curry leaves, 1 tsp oil, coriander leaves, salt","Crush the garlic, pepper and cumin together roughly.|Boil the chopped tomato in 1.5 cups water with salt and rasam powder for 6 minutes until soft; mash with the back of a spoon.|Add the crushed mix and the dal water and bring to a froth. Do not boil hard.|Heat the oil, crackle mustard, add curry leaves and pour in.|Finish with coriander. Serve 1/2 cup."],
bean:["Beans thoran","Serves 1, 15 min. 1 cup finely chopped beans, 1 tbsp grated coconut, 2 tbsp onion, 1 green chilli, 1/2 tsp mustard, 5 curry leaves, 1/4 tsp turmeric, 1 tsp oil, salt","Chop the beans into 3 mm pieces; this lets them cook quickly without water.|Heat the oil, crackle the mustard, add curry leaves, chilli and onion and fry 1 minute.|Add the beans, turmeric and salt and mix well.|Cover and cook on low heat 6 to 8 minutes, stirring once or twice. Sprinkle a spoon of water only if it sticks.|Stir in the coconut, cook 1 minute, and switch off."],
fish:["Fish (75 g)","Serves 1, 20 min plus 15 min marinating. 75 g fish, 1/4 tsp turmeric, 1/2 tsp chilli powder, 1/2 tsp lemon juice, 1/2 tsp ginger-garlic paste, salt, 1/2 tsp oil","Clean and wash the fish, pat dry with a paper towel.|Mix turmeric, chilli powder, lemon juice, ginger-garlic paste and salt into a paste and rub over the fish.|Marinate 15 minutes.|Heat a non-stick pan with 1/2 tsp oil on medium. Cook 3 to 4 minutes per side until opaque and flaky.|Do not deep fry. Serve with lemon."],
fishc:["Fish curry (75 g fish)","Serves 1, 25 min. 75 g fish, 1/4 onion, 1 small tomato, 1/2 tsp ginger-garlic paste, 1/2 tsp chilli powder, 1 tsp coriander powder, 1/4 tsp turmeric, 1 kokum or 1 tsp tamarind, 5 curry leaves, 1 tsp oil, salt","Wash the fish and cut into 2 or 3 pieces.|Heat the oil, add curry leaves, onion and ginger-garlic paste and sauté 3 minutes until soft.|Add tomato and the powders with 2 tbsp water, cook 4 minutes until oil separates.|Add 3/4 cup water, kokum or tamarind and salt and bring to a boil.|Slide in the fish, cover and simmer on low 8 to 10 minutes. Shake the pan rather than stirring so the pieces stay whole.|Rest 10 minutes for better flavour. The curry should be thin with minimal coconut."],
curd:["Curd (1 cup)","Plain unsweetened curd","Serve plain, or whisk with a pinch of salt and cumin"],
butter:["Buttermilk (1/2 cup)","Curd, water, salt, ginger, curry leaves","Whisk 1 part curd with 2 parts water|Add salt, grated ginger, crushed curry leaves"],
nuts:["Handful of nuts","Almonds, walnuts, unsalted mixed nuts","Take one handful only, unsalted and unroasted-in-oil"],
odosa:["Oats dosa (2)","Serves 1, 25 min. 1/3 cup oats flour (grind plain rolled oats fine), 2 tbsp dosa batter, 1/2 cup water, 1/4 tsp cumin, 1 tbsp chopped onion, salt, a few drops of oil","Grind plain rolled oats in a dry mixer to a fine flour.|Whisk the flour, dosa batter, cumin, onion and salt with water to a thin pouring batter. Rest 10 minutes.|Heat a non-stick tawa on medium and wipe with a drop of oil.|Pour a ladle from the edge inwards (oats batter is lacy, so fill the gaps). Cover 1 minute.|Add a few drops of oil around the edges, flip once, cook 1 minute.|Make 2 dosas and serve with soya curry or channa curry."],
soya:["Soya curry (1 cup)","Serves 1, 25 min. 25 g soya chunks, 1/2 onion, 1 tomato, 1 tsp ginger-garlic paste, 1/2 tsp coriander powder, 1/4 tsp chilli powder, 1/4 tsp turmeric, 1/4 tsp garam masala, 1 tsp oil, coriander leaves, salt","Soak the soya chunks in hot water for 10 minutes. Squeeze out the water 2 or 3 times, which removes the beany smell. Cut large pieces in half.|Heat the oil and fry onion until golden, about 4 minutes. Add ginger-garlic paste for 1 minute.|Add the tomato and powders, cook 4 minutes until soft and oily.|Add the soya, salt and 1/2 cup water, cover and simmer 8 to 10 minutes.|Stir in garam masala and coriander and serve about 1 cup."],
chick:["Chicken curry (75 g)","Serves 1, 30 min. 75 g skinless chicken, 1/4 onion, 1 small tomato, 1/2 tsp ginger-garlic paste, 1/2 tsp coriander powder, 1/4 tsp pepper, 1/4 tsp turmeric, 5 curry leaves, 1 tsp oil, salt","Wash the chicken and remove all visible fat and skin.|Heat the oil, add curry leaves and onion and cook 3 minutes. Add ginger-garlic paste, 1 minute.|Add tomato, coriander powder, turmeric and pepper and cook 4 minutes into a thick masala.|Add the chicken and salt and coat well, cook 2 minutes.|Add 1/2 cup water, cover and simmer on low 15 to 18 minutes until cooked through with no pink inside.|Reduce to a semi-thick gravy and finish with coriander."],
wdosa:["Wheat dosa (2)","Serves 1, 20 min. 1/2 cup wheat atta, 3/4 cup water, 1/4 tsp cumin, 1 tbsp chopped onion, salt, a few drops of oil","Whisk the atta with water into a smooth, thin batter with no lumps.|Add salt, cumin and onion and rest 10 minutes.|Heat a non-stick tawa on medium.|Pour a ladle and spread by tilting the tawa or with the ladle base. Add a few drops of oil on the edges.|Cook 1 to 2 minutes until the edges lift, flip, cook 30 seconds.|Make 2 dosas."],
gg:["Boiled green gram (1/2 cup)","Serves 1, 30 min plus soaking. 1/4 cup dry green gram (about 50 g), salt, pepper, lemon","Wash and soak the green gram in water for 6 to 8 hours or overnight.|Drain and pressure-cook with 1 cup water for 2 whistles. Without a cooker, boil 20 to 25 minutes.|Drain well; the grams should be soft but whole.|Measure 1/2 cup and season with salt, pepper and a few drops of lemon."],
spin:["Spinach thoran","Serves 1, 15 min. 1 big bunch or about 150 g spinach or cheera, 2 garlic cloves, 2 tbsp onion, 1 tbsp coconut, 1/2 tsp mustard, 1 dry red chilli, 1 tsp oil, salt","Wash the greens well in 2 changes of water and chop finely, stems included.|Heat the oil, crackle the mustard, then add chilli, crushed garlic and onion for 1 minute.|Add the greens and salt. Do not add water; the leaves release their own.|Cover and cook on low 5 to 6 minutes until wilted and tender.|Mix in the coconut, cook uncovered for 1 minute to dry any liquid."],
bg:["Bengal gram (1/2 cup)","Serves 1, 40 min plus soaking. 1/4 cup dry Bengal gram (about 50 g), 1/4 tsp turmeric, salt","Wash and soak the Bengal gram overnight (8 hours).|Drain, then pressure-cook with 1 cup water, turmeric and salt for 4 to 5 whistles until soft but whole.|Let the pressure release naturally.|Drain and measure 1/2 cup for the plate."],
vcurry:["Vegetable curry (1 cup)","Serves 1, 25 min. 1 cup mixed vegetables (carrot, beans, cauliflower), 1/4 onion, 1 tomato, 1/2 tsp ginger-garlic paste, 1/2 tsp coriander powder, 1/4 tsp turmeric, 1/4 tsp chilli powder, 1 tsp oil, salt","Cut the vegetables into small, even pieces so they cook together.|Heat the oil and fry onion 3 minutes, then ginger-garlic paste 1 minute.|Add tomato and the powders and cook 4 minutes until soft.|Add the vegetables, salt and 1/2 cup water. Cover and cook 10 to 12 minutes.|Mash a few pieces to thicken lightly. Aim for a medium gravy with at most a tablespoon of coconut milk or none."],
chap:["Chapati (2)","Serves 1, 25 min. 1/2 cup wheat atta (about 50 g), 1/4 cup water, pinch of salt, dry flour for rolling","Mix atta and salt, add water a little at a time, and knead 5 minutes into a soft dough.|Cover and rest 15 minutes.|Divide into 2 balls, dust and roll into 15 cm rounds, thin and even.|Heat a tawa on medium-high. Cook 30 seconds, flip, cook 30 seconds more.|Press the edges with a cloth until it puffs. No ghee or oil on top."],
chan:["Channa curry (1 cup)","Serves 1, 40 min plus soaking. 1/4 cup black channa (about 50 g dry), 1/2 onion, 1 tomato, 1/2 tsp ginger-garlic paste, 1/2 tsp coriander powder, 1/4 tsp chilli powder, 1/4 tsp garam masala, 1/4 tsp turmeric, 1 tsp oil, coriander leaves, salt","Soak the channa overnight (8 hours).|Pressure-cook with salt and 1.5 cups water for 5 to 6 whistles until soft.|Heat the oil, fry onion until golden (4 minutes), add ginger-garlic paste for 1 minute.|Add tomato and the powders and cook 4 minutes.|Add the channa with its cooking water, mash a few to thicken, and simmer 10 minutes.|Add garam masala and coriander. Serve 1 cup."],
cab:["Cabbage thoran","Serves 1, 12 min. 1 cup finely shredded cabbage, 1 tbsp coconut, 1/2 tsp mustard, 5 curry leaves, 1 green chilli, 1/4 tsp turmeric, 1 tsp oil, salt","Shred the cabbage very fine and keep dry.|Heat the oil, crackle the mustard, add curry leaves and chilli.|Add the cabbage, turmeric and salt and toss on medium heat.|Cover and cook 4 to 5 minutes. It should stay slightly crunchy.|Mix in the coconut and switch off."],
spr:["Sprouted green gram (1/2 cup)","Serves 1, 10 min after sprouting. 1/4 cup dry green gram, salt, pepper, lemon, 1 tbsp chopped onion","Soak the green gram 8 hours, drain, and tie in a damp cloth or leave in a colander covered.|Keep 12 to 24 hours in a warm spot, rinsing once or twice, until tails about 5 mm show.|Steam the sprouts for 5 minutes (or eat raw if you are comfortable with it; steaming is safer).|Toss with salt, pepper, lemon and onion."],
puttu:["Oats puttu (one serving)","Serves 1, 20 min. 1/3 cup oats flour (plain oats ground fine), 3 to 4 tbsp salted water, 1 tbsp coconut","Dry-roast the oats flour in a pan on low heat for 2 minutes, then cool.|Sprinkle the salted water a spoon at a time, mixing, until the flour is crumbly and holds a lightly pressed fist but falls apart again.|In the puttu maker add a layer of coconut, then the flour, then coconut again, until filled.|Steam 6 to 8 minutes until steam comes out from the top.|Push the cylinder out gently and serve with kadala curry."],
kad:["Kadala curry (1 cup)","Serves 1, 40 min plus soaking. 1/4 cup black channa (about 50 g dry), 1/2 onion, 1 tomato, 1 tbsp coconut, 1 tsp coriander powder, 1/4 tsp pepper, 1/4 tsp turmeric, 1/2 tsp mustard, 5 curry leaves, 1 tsp oil, salt","Soak the channa overnight and pressure-cook with salt for 5 to 6 whistles.|Dry-roast the coriander powder and pepper 30 seconds, then grind with the coconut and a splash of water.|Heat the oil, crackle the mustard, add curry leaves and onion for 3 minutes, then tomato for 3 minutes.|Add turmeric, the channa with some of its water and the ground paste.|Simmer 10 minutes until it thickens. Serve 1 cup."],
idiy:["Idiyappam (2)","Serves 1, 20 min. 1/2 cup idiyappam flour (rice flour, about 50 g), about 1/3 cup hot water, pinch of salt","Boil the water, add salt and pour over the flour, mixing with a spoon until it forms a soft, non-sticky dough.|Cool 3 minutes until you can handle it, then knead briefly.|Fill the dough in a sev maker. Press 2 spirals onto greased idli plates or banana leaf squares.|Steam 8 to 10 minutes.|Serve with vegetable curry. No coconut milk or sugar."],
mixt:["Mixed vegetable thoran","Serves 1, 15 min. 1 cup finely chopped carrot, beans and cabbage, 1 tbsp coconut, 1/2 tsp mustard, 5 curry leaves, 1/4 tsp turmeric, 1 tsp oil, salt","Chop all vegetables very fine, about 3 mm.|Heat the oil, crackle the mustard, add curry leaves.|Add the vegetables, turmeric and salt and mix.|Cover and cook on low heat 6 to 8 minutes, stirring once. No water needed.|Mix in the coconut and cook uncovered 1 minute."],
ragi:["Ragi dosa (2)","Serves 1, 25 min. 1/3 cup ragi flour, 2 tbsp dosa batter, 1/2 cup water, 1/4 tsp cumin, salt, a few drops of oil","Whisk the ragi flour, batter, cumin and salt with the water to a thin batter, with no lumps.|Rest 10 minutes; it thickens, so thin with a splash of water.|Heat a non-stick tawa on medium and wipe lightly with oil.|Pour a ladle in a spiral from the edge in. Cover for 1 minute.|Add a few drops of oil on the edges, flip once and cook 1 minute.|Make 2 dosas."],
veg:["Vegetable thoran","Serves 1, 15 min. 1 cup mixed finely chopped vegetables, 1 tbsp coconut, 1/2 tsp mustard, 5 curry leaves, 1 green chilli, 1/4 tsp turmeric, 1 tsp oil, salt","Chop the vegetables very fine.|Heat the oil, crackle the mustard, add curry leaves and chilli.|Add the vegetables, turmeric and salt.|Cover and cook on low 6 to 8 minutes, stirring once.|Mix in the coconut and switch off."],
rajma:["Rajma (about 50 g dry)","Serves 1, 50 min plus soaking. 1/4 cup dry rajma (about 50 g), 1/2 onion, 1 tomato, 1/2 tsp ginger-garlic paste, 1/2 tsp coriander powder, 1/4 tsp chilli powder, 1 tsp oil, salt","Soak the rajma overnight (8 hours) and discard the water.|Pressure-cook with salt and 2 cups fresh water for 6 to 7 whistles until it mashes easily.|Heat the oil, fry onion 4 minutes, add ginger-garlic paste 1 minute, then tomato and powders for 4 minutes.|Add the rajma with its water and simmer 10 minutes.|Mash a few beans to thicken. Serve about 1/2 cup."],
bread:["Whole-grain bread (2 slices)","Whole-grain bread","Toast lightly on a dry tawa. No butter"],
dosa:["Dosa (2)","Serves 1, 15 min. About 120 g dosa batter, a few drops of oil","Let the batter come to room temperature and stir gently.|Heat a non-stick tawa on medium. Sprinkle a few drops of water; they should sizzle and vanish.|Pour a ladle in the centre and spread in a circle with the back of the ladle.|Drizzle a few drops of oil around the edge and cook 1 to 2 minutes until golden and crisp.|Fold and serve. Make 2 medium dosas."],
upma:["Broken wheat upma (1/2 cup)","Serves 1, 25 min. 1/4 cup broken wheat, 1 tbsp each chopped carrot, beans and onion, 1/2 tsp mustard, 1 green chilli, 5 curry leaves, 1 tsp oil, salt","Dry-roast the broken wheat on low heat 3 minutes until it smells nutty, then set aside.|Heat the oil, crackle the mustard, add chilli, curry leaves and onion and fry 2 minutes.|Add the carrot and beans with 2 tbsp water and cook 2 minutes.|Add 3/4 cup water and salt and bring to a boil.|Stir in the wheat, cover and cook on the lowest heat 8 to 10 minutes. Rest 5 minutes and fluff."]

/* Local storage + cloud sync (every store.set is also saved to MongoDB through /api/sync) */
const LS=window.localStorage;
const raw={get(k){try{return LS.getItem(k)}catch(e){return null}},set(k,v){try{LS.setItem(k,v)}catch(e){}},del(k){try{LS.removeItem(k)}catch(e){}}};
const jparse=(t,d)=>{try{const v=JSON.parse(t);return v==null?d:v}catch(e){return d}};
const store={get(k){return jparse(raw.get(k),{})},set(k,v){raw.set(k,JSON.stringify(v));SYNC.touch(k)}};
const KEY_OK=/^[A-Za-z0-9_-]{1,60}$/;

async function api(path,opts){
  opts=opts||{};
  const body=opts.body?JSON.stringify(opts.body):undefined;
  let r;
  try{
    r=await fetch("/api"+path,{
      method:opts.method||"GET",
      headers:Object.assign({"Content-Type":"application/json"},SYNC.token?{Authorization:"Bearer "+SYNC.token}:{}),
      body:body,
      keepalive:!!body&&body.length<60000
    });
  }catch(e){throw new Error("Cannot reach the server. Check your internet connection.")}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&SYNC.token&&path!=="/auth"){SYNC.logout(true)}
  if(!r.ok)throw new Error(j.error||("Server error ("+r.status+")"));
  return j;
}

const SYNC={
  token:raw.get("hp_token")||"",
  user:jparse(raw.get("hp_user"),null),
  ts:jparse(raw.get("hp_ts"),{}),
  dirty:jparse(raw.get("hp_dirty"),[]),
  timer:null,busy:false,applying:false,st:"idle",
  meta(){raw.set("hp_ts",JSON.stringify(this.ts));raw.set("hp_dirty",JSON.stringify(this.dirty))},
  state(x){
    this.st=x;
    if(document.body)document.body.dataset.sync=x;
    const e=document.getElementById("syncTxt");
    if(e)e.textContent=({ok:"All changes are saved to the cloud.",saving:"Saving…",error:"Cannot reach the server. Your changes are kept on this device and will upload automatically."})[x]||"";
  },
  touch(k){
    if(this.applying||!KEY_OK.test(k))return;
    this.ts[k]=Date.now();
    if(!this.dirty.includes(k))this.dirty.push(k);
    this.meta();
    if(!this.token)return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.flush(),1200);
  },
  async flush(){
    if(!this.token||this.busy)return true;
    this.dirty=this.dirty.filter(k=>raw.get(k)!=null);
    if(!this.dirty.length)return true;
    this.busy=true;this.state("saving");
    try{
      const queue=this.dirty.slice();
      while(queue.length){
        const items=[],sent={};let size=0;
        while(queue.length&&items.length<40){
          const k=queue[0],t=raw.get(k)||"{}";
          if(items.length&&size+t.length>900000)break;
          queue.shift();size+=t.length;
          sent[k]=this.ts[k]||Date.now();
          items.push({key:k,value:jparse(t,{}),t:sent[k]});
        }
        await api("/sync",{method:"POST",body:{items:items}});
        this.dirty=this.dirty.filter(k=>!(k in sent)||(this.ts[k]||0)>sent[k]);
        this.meta();
      }
      this.state("ok");
    }catch(e){
      this.state("error");this.busy=false;return false;
    }
    this.busy=false;
    if(this.dirty.length){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1200)}
    return true;
  },
  async pull(){
    if(!this.token)return false;
    const j=await api("/sync");
    let changed=false;const seen=new Set();
    this.applying=true;
    try{
      (j.items||[]).forEach(it=>{
        if(!KEY_OK.test(it.key))return;
        seen.add(it.key);
        const st=+it.updatedAt||0,lt=this.ts[it.key]||0,has=raw.get(it.key)!=null;
        if(has&&this.dirty.includes(it.key)&&lt>=st)return;
        if(!has||st>lt){
          raw.set(it.key,JSON.stringify(it.value));
          this.ts[it.key]=st;
          this.dirty=this.dirty.filter(x=>x!==it.key);
          changed=true;
        }
      });
    }finally{this.applying=false}
    for(let i=0;i<LS.length;i++){
      const k=LS.key(i);
      if(k&&!k.startsWith("hp_")&&KEY_OK.test(k)&&!seen.has(k)&&!this.dirty.includes(k)){
        this.dirty.push(k);this.ts[k]=this.ts[k]||Date.now();
      }
    }
    this.meta();
    return changed;
  },
  async sync(){
    try{const ch=await this.pull();await this.flush();return ch}
    catch(e){this.state("error");return false}
  },
  setSession(r){
    const prev=raw.get("hp_uid");
    if(prev&&prev!==r.user.id){LS.clear();this.ts={};this.dirty=[]}
    this.token=r.token;this.user=r.user;
    raw.set("hp_token",r.token);raw.set("hp_user",JSON.stringify(r.user));raw.set("hp_uid",r.user.id);
    this.meta();
  },
  async logout(forced){
    if(forced){this.token="";raw.del("hp_token");showAuth("Please log in again.");return}
    await this.flush();
    if(this.dirty.length&&!confirm("Some changes are not uploaded yet and will be lost if you log out. Log out anyway?"))return;
    LS.clear();location.reload();
  }
};

cu:["പയർ/കടല/രാജ്മ ആണെങ്കിൽ കുതിർത്ത് കുക്കറിൽ വേവിച്ചുവെക്കുക.","1 ടീസ്പൂൺ എണ്ണയിൽ കറിവേപ്പില, അല്പം സവാള, ഇഞ്ചി-വെളുത്തുള്ളി വഴറ്റുക.","തക്കാളിയും പൊടികളും ചേർത്ത് 4 മിനിറ്റ് വഴറ്റി കുഴമ്പ് പോലെയാക്കുക.","പ്രധാന ചേരുവയും വെള്ളവും ഉപ്പും ചേർത്ത് അടച്ച് ചെറുതീയിൽ വേവിക്കുക (ചിക്കൻ 15–18 മിനിറ്റ്, മീൻ 8–10 മിനിറ്റ്, പയർ/കടല 10 മിനിറ്റ്).","മല്ലിയില ചേർത്ത് വിളമ്പുക."],
pl:["വൃത്തിയാക്കി 6–8 മണിക്കൂർ (കടല രാത്രി മുഴുവൻ) കുതിർക്കുക.","വെള്ളവും ഉപ്പും ചേർത്ത് കുക്കറിൽ 2–5 വിസിൽ വരെ വേവിക്കുക.","വെള്ളം ഊറ്റി നിർദ്ദേശിച്ച അളവ് മാത്രം എടുക്കുക."],
sp:["ചെറുപയർ 8 മണിക്കൂർ കുതിർത്ത് വെള്ളം ഊറ്റുക.","നനഞ്ഞ തുണിയിൽ കെട്ടി 12–24 മണിക്കൂർ വച്ച് മുള വരുത്തുക.","5 മിനിറ്റ് ആവിയിൽ വേവിക്കുക.","ഉപ്പ്, കുരുമളക്, നാരങ്ങാനീര് ചേർക്കുക."],
st:["മാവ്/പൊടി തയ്യാറാക്കുക (ഇഡ്ഡലി മാവ് ഇളക്കി, ഇടിയപ്പം/പുട്ട് പൊടി ഈർപ്പം ചേർത്ത്).","പാത്രത്തിൽ ഏതാണ്ട് തുള്ളി എണ്ണ തടവി മാവ്/പൊടി നിറയ്ക്കുക.","ആവിയിൽ 8–12 മിനിറ്റ് വേവിക്കുക; ഈർക്കില്ലി കുത്തിനോക്ക്മ്പോൾ ഒട്ടരുത്.","ചൂടോടെ കറിയോടൊപ്പം വിളമ്പുക."],
co:["ചോളം 10–12 മിനിറ്റ് ആവിയിൽ വേവിക്കുക.","ഉപ്പ്, കുരുമളക്, നാരങ്ങാനീര് ചേർക്കുക; വെണ്ണ വേണ്ട."],
ch:["ഗോതമ്പ് പൊടി ഉപ്പും വെള്ളവും ചേർത്ത് മൃദുവായി കുഴയ്ക്കുക; 15 മിനിറ്റ് വയ്ക്കുക.","ഉരുളകളാക്കി നേർത്തതായി പരത്തുക.","ചൂടായ തവയിൽ ഇരുവശവും 30 സെക്കൻഡ് വീതം ചുട്ടെടുക്കുക; എണ്ണ/നെയ്യ് തടവരുത്."],
up:["ഗോതമ്പ് നുറുക്ക് 3 മിനിറ്റ് വറുത്ത് മാറ്റുക.","1 ടീസ്പൂൺ എണ്ണയിൽ കടുക്, കറിവേപ്പില, പച്ചമുളക്, അല്പം സവാള വഴറ്റുക.","പച്ചക്കറിയും 3/4 കപ്പ് വെള്ളവും ഉപ്പും ചേർത്ത് തിളപ്പിക്കുക.","ഗോതമ്പ് നുറുക്ക് ചേർത്ത് അടച്ച് ചെറുതീയിൽ 8–10 മിനിറ്റ് വേവിക്കുക."],
ri:["അരി 3 തവണ കഴുകി 15 മിനിറ്റ് കുതിർക്കുക.","1:2 അനുപാതത്തിൽ വെള്ളത്തിൽ ഉപ്പ് ചേർത്ത് വേവിക്കുക.","അടച്ച് ചെറുതീയിൽ 12–15 മിനിറ്റ്; 5 മിനിറ്റ് വച്ചശേഷം ഇളക്കുക. അളന്ന അളവ് മാത്രം കഴിക്കുക."],
sa:["പരിപ്പ് മഞ്ഞൾ ചേർത്ത് കുക്കറിൽ 3 വിസിൽ വേവിക്കുക.","പച്ചക്കറികൾ ഉപ്പ് ചേർത്ത് വേവിക്കുക.","പുളിവെള്ളവും സാമ്പാർ പൊടിയും ചേർത്ത് 5 മിനിറ്റ് തിളപ്പിക്കുക.","പരിപ്പ് ചേർത്ത് 5 മിനിറ്റ് കൂടി തിളപ്പിക്കുക.","കടുക്, ഉണക്കമുളക്, കറിവേപ്പില താളിച്ച് ചേർക്കുക."],
ra:["തക്കാളി രസം പൊടിയും ഉപ്പും ചേർത്ത് 6 മിനിറ്റ് വേവിച്ച് ഉടയ്ക്കുക.","ചതച്ച വെളുത്തുള്ളി, കുരുമളക്, ജീരകം, പരിപ്പ് വെള്ളം ചേർത്ത് പതഞ്ഞുവരുമ്പോൾ ഇറക്കുക.","കടുക്, കറിവേപ്പില താളിച്ച് മല്ലിയില ചേർക്കുക."],
fi:["മീൻ കഴുകി മഞ്ഞൾ, മുളകുപൊടി, നാരങ്ങാനീര്, ഉപ്പ് പുരട്ടി 15 മിനിറ്റ് വയ്ക്കുക.","നോൺ-സ്റ്റിക്ക് പാനിൽ അര ടീസ്പൂൺ എണ്ണയിൽ ഇരുവശവും 3–4 മിനിറ്റ് വീതം വേവിക്കുക.","വറുക്കരുത്; നാരങ്ങയോടൊപ്പം വിളമ്പുക."],
eg:["മുട്ട 10 മിനിറ്റ് പുഴുങ്ങുക.","തണുത്ത വെള്ളത്തിൽ ഇട്ട് തൊലി കളയുക.","മഞ്ഞക്കരു മാറ്റി വെള്ള മാത്രം കുരുമളകും ഉപ്പും ചേർത്ത് കഴിക്കുക."],
sl:["പച്ചക്കറികൾ കഴുകി നേർത്തതായി അരിയുക.","നാരങ്ങാനീരും ഉപ്പും കുരുമളകും ചേർത്ത് ഇളക്കുക.","എണ്ണയോ ഡ്രസ്സിംഗോ ചേർക്കരുത്; ഉടൻ കഴിക്കുക."],
te:["വെള്ളം തിളപ്പിച്ച് ചായപ്പൊടി/കാപ്പിപ്പൊടി ചേർത്ത് അരിച്ചെടുക്കുക.","പഞ്ചസാര, തേൻ, ശർക്കര ഒന്നും ചേർക്കരുത്."],
cd:["പ്ലെയിൻ തൈര് അളന്ന് വിളമ്പുക."],
bm:["തൈര് വെള്ളം ചേർത്തടിക്കുക.","ഉപ്പ്, ഇഞ്ചി, കറിവേപ്പില ചേർക്കുക."],
nu:["ഒരു പിടി മാത്രം എടുക്കുക; ഉപ്പില്ലാത്തത്."],
br:["ഡ്രൈ തവയിൽ ചെറുതായി ടോസ്റ്റ് ചെയ്യുക; വെണ്ണ വേണ്ട."],
mu:["എല്ലില്ലാത്ത കൊഴുപ്പ് കുറഞ്ഞ കഷണങ്ങൾ എടുത്ത് കാണുന്ന കൊഴുപ്പ് മുഴുവൻ നീക്കി കഴുകി ചെറുതായി മുറിക്കുക.","മഞ്ഞൾ, ഉപ്പ്, ഇഞ്ചി-വെളുത്തുള്ളി, അല്പം വെള്ളം എന്നിവ ചേർത്ത് കുക്കറിൽ 4–5 വിസിൽ (ഏകദേശം 25 മിനിറ്റ്) വേവിക്കുക.","1 ടീസ്പൂൺ എണ്ണയിൽ കറിവേപ്പില, അല്പം സവാള, തക്കാളി, മല്ലിപ്പൊടി, മുളകുപൊടി, കുരുമുളക് എന്നിവ വഴറ്റുക.","വേവിച്ച ഇറച്ചി അതിന്റെ സ്റ്റോക്കോടെ ചേർത്ത് 10 മിനിറ്റ് തിളപ്പിച്ച് കുറുക്കുക; തേങ്ങാപ്പാലോ നെയ്യോ ചേർക്കരുത്.","മുകളിലെ കൊഴുപ്പ് നീക്കി 75 ഗ്രാം മാത്രം വിളമ്പുക."],
ba:["അരിയും ഉഴുന്നും വെവ്വേറെ 5–6 മണിക്കൂർ കുതിർക്കുക.","ഉഴുന്ന് തണുത്ത വെള്ളം ചേർത്ത് പതപോലെ അരയ്ക്കുക; അരി അല്പം തരിയോടെ അരയ്ക്കുക.","ഉപ്പ് ചേർത്ത് കൈകൊണ്ട് നന്നായി യോജിപ്പിക്കുക.","ചൂടുള്ള സ്ഥലത്ത് 8–10 മണിക്കൂർ പുളിക്കാൻ വയ്ക്കുക; മാവ് പൊങ്ങിവരും.","ഫ്രിഡ്ജിൽ 3 ദിവസം വരെ സൂക്ഷിക്കാം; ഇളക്കുമ്പോൾ പതുക്കെ മാത്രം ഇളക്കുക."]
};

/* Theme Handling */
function initTheme(){
  const t=store.get("theme").v||"";
  if(t)document.documentElement.setAttribute("data-theme",t);
  updateThemeBtn();
}
function isDark(){
  const t=document.documentElement.getAttribute("data-theme");
  if(t==="dark")return true;
  if(t==="light")return false;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
}
function updateThemeBtn(){
  const b=$("#themeBtn");if(!b)return;
  b.innerHTML=isDark()?SVG.sun:SVG.moon;

function groceryData(){
  if(day===1)return [SHOP.mon[0],SHOP.mon[1].filter(g=>g[0]!=="Occasional")];
  if(day===4){
    const t=new Date();t.setDate(t.getDate()+(4-t.getDay()+7)%7+3);
    const gs=SHOP.thu[1].map(g=>[g[0],g[1].slice()]);
    if(muttonSun(t))gs[0][1].push(["Mutton","100 g (for Sunday lunch)"]);
    return [SHOP.thu[0]+". Also cook from stock.",[...gs,["Use from stock today",[["Rajma","50 g (dinner)"],["Guava","1"],["Ragi flour, eggs (2), vegetables","per meal plan"]]]]];
  }
  const mu=day===0&&muttonSun(relSun());
  return ["No routine shopping today. Only small fresh top-ups if needed, then cook from stock.",TOP[day].map(g=>[g[0],g[1].map(it=>mu&&it[0]==="Fish"?["Mutton (lean, boneless)","75 g, bought on Thursday"]:it)])];
}
function needOf(g,it){const m=it[1].match(/^([\d.]+)/);if(!m)return 0;const f=tot(),k=/Cooking/.test(g)?1+(f-1)/2:f;let v=+m[1];if(/^Fresh/.test(g)&&it[0]!=="Capsicum")v*=2;return v*k}
function qtxt(v,u){if(u==="g")return v>=1000?+(v/1000).toFixed(2)+" kg":Math.round(v)+" g";if(u==="ml")return v>=1000?+(v/1000).toFixed(2)+" L":Math.round(v)+" ml";return String(Math.round(v*100)/100)}
function buyData(){
  const inv=store.get("inv"),n=new Date(),sun=new Date(n);
  sun.setDate(n.getDate()+(7-n.getDay())%7);
  const mu=muttonSun(sun),out=[];
  SHOP.mon[1].forEach(g=>g[1].forEach(it=>{
    if(g[0]==="Occasional"&&!mu)return;
    const need=needOf(g[0],it),have=inv[it[0]]||0;
    if(!need||have>=need*0.25)return;
    const u=(it[1].match(/^[\d.]+\s*(g|ml)\b/)||[])[1]||"";
    let b=need-have;
    b=u?(b>=100?Math.ceil(b/50)*50:Math.ceil(b/10)*10):Math.ceil(b-0.01);
    const p=PR[it[0]],cost=p?(u?b/1000*p[0]:b*p[0]):0;
    out.push({n:it[0],u,have,b,cost,s:p?p[1]:0});
  }));
  return out;
}
function buyCard(){

    if(rt){total+=cost;bySrc[rt.s]=(bySrc[rt.s]||0)+cost;if(rt.s!=="E")got++}
    rows+=`<details class="buy-item"><summary><span>${i+1}. ${esc(x.n)}</span><span class="buy-r"><span class="buy-q">${qtxt(x.b,x.u)}</span><span class="buy-p">${rt?"₹"+Math.round(cost)+(rt.s==="E"?"*":""):"–"}</span></span></summary><div class="buy-detail"><div>Stock: ${qtxt(x.have,x.u)}</div>`;
    rows+=rt?`<div>${fr(rt.r)} × ${qtxt(x.b,x.u)} = <b>₹${Math.round(cost)}</b></div><div>Source: ${SRC[rt.s]}${rt.s==="E"?"":rt.live?" · live":" · cached"}${rt.ft?" · updated "+fmtT(rt.ft):""}</div>`:"<div>No price found</div>";
    const c=CM[x.n];
    if(c){
      let lo=1e9;["R","F","I"].forEach(s=>{if(c[s]&&c[s].length)lo=Math.min(lo,med(c[s]).r)});
      ["R","F","I"].forEach(s=>{
        const l=c[s];if(!l)return;
        rows+=`<div class="slot-lbl">${SRC[s]}${l.length&&med(l).r===lo?" ★":""}</div>`;
        if(!l.length){rows+=`<small style="color:var(--mute)">Not found</small>`;return}
        l.forEach((m,k)=>{
          rows+=`<div class="mt${rt&&rt.s===s&&rt.m&&rt.m.n===m.n?" on":""}"><button class="mtb" data-i="${esc(x.n)}" data-s="${s}" data-x="${k}">${esc(m.n)}<br><b>${fr(m.r)}</b>${m.a?" (pack assumed)":""}</button><a href="${m.url||"#"}" target="_blank" rel="noopener" aria-label="Open">${SVG.ext}</a></div>`;
        });
      });
    }
    rows+=`</div></details>`;
  });
  const chips=Object.keys(bySrc).map(s=>`<span class="chip">${SRC[s]}: ₹${Math.round(bySrc[s])}</span>`).join("");
  return `<div class="card" id="buyc"><div class="buy-head"><h3>${SVG.bag} Buy list (empty or low stock)</h3><div class="buy-total">₹${Math.round(total)}</div></div>${rows}<div class="src-chips">${chips}<span class="chip">Retrieved: ${got}</span><span class="chip">Not retrieved (estimate only): ${L.length-got}</span></div><p style="margin:8px 0 0;font-size:.74rem;color:var(--mute)">* Estimate. Instamart prices depend on delivery location. Flipkart listings may assume a 1 kg pack when none is stated.</p></div>`;
}
