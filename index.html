    else if(k==="c")c.c=Math.max(0,Math.min(10,c.c+s));
    else if(k==="d")c.d+=s;
    else c[k]=Math.max(0.25,Math.min(3,Math.round((c[k]+s)*100)/100));
    c.d=Math.max(1,Math.min(c.d,c.a+c.c));
    store.set("fam2",c);famOpen=true;render();
  });
}

/* Stock Meal Deduction & Pending Confirmation */
function useOf(w,i){
  const m=M[w].m[i],T=tot(),o={};
  const add=(n,a)=>{o[n]=(o[n]||0)+a*T};
  m[2].forEach(k=>(U[k]?U[k].split(","):[]).forEach(x=>{const p=x.split(":");add(p[0],+p[1])}));
  if(i===4){const fr={Guava:["Guava",1],Apple:["Green apple",1],Papaya:["Papaya",125]}[M[w].f];add(fr[0],fr[1])}
  return o;
}
function setMeal(k,w,i,val){
  const all=store.get("done"),dn=all[k]=all[k]||{},prev=dn[i],inv=store.get("inv");
  if(prev&&prev.s===1&&prev.d){for(const n in prev.d)inv[n]=Math.round(((inv[n]||0)+prev.d[n])*100)/100}
  let d=null;
  if(val===1){d=useOf(w,i);for(const n in d){const a=Math.min(inv[n]||0,d[n]);inv[n]=Math.round(((inv[n]||0)-a)*100)/100;d[n]=a}}
  dn[i]={s:val,d:d};store.set("inv",inv);store.set("done",all);
}
function pending(){
  applyMutton();
  const out=[],nm=new Date().getHours()*60+new Date().getMinutes(),dn=store.get("done");
  for(let o=1;o>=0;o--){
    const d=new Date();d.setDate(d.getDate()-o);
    const k=d.toLocaleDateString("en-CA"),w=d.getDay();
    M[w].m.forEach((m,i)=>{if((o>0||nm>=MT[i]+60)&&!(dn[k]&&dn[k][i]))out.push({k,w,i,o})});
  }
  return out;
}
function checkPending(){
  if($("#ov"))return;
  const p=pending();if(!p.length)return;
  let h=`<div id="ov"><div class="sheet"><h3>Were these meals prepared?</h3><p class="sheet-sub">Tick what you cooked. Stock is reduced for ticked meals. Untick any you skipped.</p>`,last=-1;
  p.forEach((x,j)=>{
    if(x.o!==last){h+=`<div class="slot-lbl">${x.o?"Yesterday":"Today"}, ${D[x.w]}</div>`;last=x.o}
    const m=M[x.w].m[x.i];
    h+=`<label class="chk-row"><input type="checkbox" data-j="${j}" checked><span class="chk-lbl"><b>${m[0]}</b> · ${esc(m[1])}</span></label>`;
  });
  h+=`<div class="form-row" style="margin-top:16px"><button class="btn-primary" id="ovs" style="flex:1">Save</button><button class="btn-ghost" id="ovl" style="flex:1">Ask me later</button></div></div></div>`;
  document.body.insertAdjacentHTML("beforeend",h);
  $("#ovs").onclick=()=>{document.querySelectorAll("#ov input").forEach(c=>{const x=p[+c.dataset.j];setMeal(x.k,x.w,x.i,c.checked?1:0)});$("#ov").remove();render()};
  $("#ovl").onclick=()=>$("#ov").remove();
  trDom();
}

/* Core Render & Event Wiring */
function render(){
  $("#title").textContent=tab==="dash"?"Dashboard":tab==="inv"?"Kitchen stock":tab==="health"?"Exercise & medication":(day===now?"Today, "+D[day]:D[day]);
  $("#days").style.display=(tab==="inv"||tab==="health"||tab==="dash")?"none":"";
  document.querySelectorAll(".days button").forEach(b=>b.classList.toggle("on",+b.dataset.d===day));
  document.querySelectorAll(".tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.t===tab);b.setAttribute("role","tab")});
  ({dash:HPD.renderDash,shop:renderShop,meals:renderMeals,cook:renderCook,inv:renderInv,health:renderHealth})[tab]();
  if(tab!=="health"&&tab!=="dash")addFam();
  trDom();
}
function setLang(l){
  lang=l;if(store.get("lang").v!==l)store.set("lang",{v:l});
  document.documentElement.lang=l;
  document.querySelectorAll(".seg-lang span[data-l]").forEach(s=>s.classList.toggle("on",s.dataset.l===l));
  render();
}

$("#view").addEventListener("click",e=>{
  const b=e.target.closest(".mtb");if(!b)return;
  const m=(CM[b.dataset.i]||{})[b.dataset.s];if(!m||!m[+b.dataset.x])return;
  PSEL[b.dataset.i]={s:b.dataset.s,n:m[+b.dataset.x].n};
  store.set("psel",PSEL);repaintBuy();
});

const order=[1,2,3,4,5,6,0];
$("#days").innerHTML=order.map(d=>`<button data-d="${d}" class="${d===now?"today":""}">${D[d].slice(0,3)}</button>`).join("");
document.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("#lang").onclick=()=>setLang(lang==="ml"?"en":"ml");

/* ---------- Login screen ---------- */
const LEAF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>';
function showAuth(msg){
  const old=$("#auth");if(old)old.remove();
  let mode="login";
  const el=document.createElement("div");el.id="auth";document.body.appendChild(el);
  const paint=()=>{
    const reg=mode==="register";
    el.innerHTML=`<div class="auth-card"><div class="brand-mark">${LEAF}</div><h2>Healthy Plate</h2><p class="sub">Kerala diet planner. Log in to keep your data safe in the cloud and use it on any device.</p>
<div class="auth-tabs"><button type="button" data-m="login" class="${reg?"":"on"}">Log in</button><button type="button" data-m="register" class="${reg?"on":""}">Create account</button></div>
<form id="authf">
${reg?'<label class="fld"><span>Your name</span><input id="a-name" autocomplete="name" maxlength="60"></label>':""}
<label class="fld"><span>Username</span><input id="a-user" autocomplete="username" autocapitalize="none" required maxlength="40"></label>
<label class="fld"><span>Password${reg?" (at least 8 characters)":""}</span><input id="a-pass" type="password" autocomplete="${reg?"new-password":"current-password"}" required></label>
${reg?'<label class="fld"><span>Invite code (only if you were given one)</span><input id="a-inv" autocomplete="off"></label>':""}
<p class="auth-err" id="a-err">${esc(msg||"")}</p>
<button class="btn-primary btn-block" id="a-go" type="submit">${reg?"Create account":"Log in"}</button></form></div>`;
    el.querySelectorAll(".auth-tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;msg="";paint()});
    el.querySelector("#a-user").focus();
    el.querySelector("#authf").onsubmit=async ev=>{
      ev.preventDefault();
      const go=el.querySelector("#a-go"),err=el.querySelector("#a-err");
      go.disabled=true;err.textContent="";
      try{
        const r=await api("/auth",{method:"POST",body:{
          action:mode,
          username:el.querySelector("#a-user").value,
          password:el.querySelector("#a-pass").value,
          name:reg?el.querySelector("#a-name").value:"",
          invite:reg?el.querySelector("#a-inv").value:""
        }});
        SYNC.setSession(r);
        el.remove();
        tab="dash";
        boot(true);
        SYNC.sync().then(ch=>{if(ch)refreshAll();checkPending()});
      }catch(e){err.textContent=e.message||"Something went wrong.";go.disabled=false}
    };
  };
  paint();
}

/* ---------- Profile / account sheet ---------- */
function applyProfile(){
  const e=$("#kcal");if(!e)return;
  const k=+(store.get("profile").kcal)||1600;
  e.textContent=k+" kcal";
}
function openAcct(){
  if($("#acct"))return;
  const p=store.get("profile"),u=SYNC.user||{};
  const fl=(id,l,v,t,extra,wide)=>`<label class="fld${wide?" wide":""}"><span>${l}</span><input id="${id}" type="${t||"text"}" value="${esc(v==null?"":v)}" ${extra||""}></label>`;
  const sex=["","Female","Male","Other"].map(x=>`<option value="${x}" ${p.sex===x?"selected":""}>${x||"–"}</option>`).join("");
  document.body.insertAdjacentHTML("beforeend",`<div id="acct"><div class="sheet"><h3>Your profile</h3><p class="sheet-sub">Logged in as <b>${esc(u.username||"")}</b>. <span id="syncTxt"></span></p>
<div class="fld-grid">
${fl("p-name","Name",p.name||u.name,"text","maxlength=60",1)}
${fl("p-age","Age",p.age,"number","min=1 max=120 inputmode=numeric")}
<label class="fld"><span>Sex</span><select id="p-sex">${sex}</select></label>
${fl("p-h","Height (cm)",p.height,"number","min=50 max=250 step=any")}
${fl("p-w","Weight (kg)",p.weight,"number","min=10 max=400 step=any")}
${fl("p-k","Daily calories (kcal)",p.kcal||1600,"number","min=800 max=4000")}
${fl("p-tw","Target weight (kg)",p.tw,"number","min=20 max=300 step=any")}
${fl("p-tb","Target BMI",p.tb,"number","min=14 max=40 step=any")}
${fl("p-dr","Doctor",p.doctor,"text","maxlength=80")}
${fl("p-di","Dietitian",p.dietitian,"text","maxlength=80",1)}
${fl("p-cond","Health conditions",p.conditions,"text","maxlength=200",1)}
${fl("p-notes","Other notes (allergies etc.)",p.notes,"text","maxlength=300",1)}
</div>
<div class="form-row" style="margin-top:6px"><button class="btn-primary" id="p-save" style="flex:1">Save</button><button class="btn-ghost" id="p-sync" style="flex:1">Sync now</button></div>
<div class="form-row"><button class="btn-danger-outline" id="p-out" style="flex:1">Log out</button><button class="btn-ghost" id="p-close" style="flex:1">Close</button></div></div></div>`);
  SYNC.state(SYNC.st||"idle");
  const el=$("#acct"),num=v=>{const x=parseFloat(v);return isNaN(x)?"":x};
  const close=()=>el.remove();
  el.onclick=e=>{if(e.target===el)close()};
  $("#p-close").onclick=close;
  $("#p-save").onclick=()=>{
    store.set("profile",{
      name:$("#p-name").value.trim(),age:num($("#p-age").value),sex:$("#p-sex").value,
      height:num($("#p-h").value),weight:num($("#p-w").value),kcal:num($("#p-k").value)||1600,tw:num($("#p-tw").value),tb:num($("#p-tb").value),
      doctor:$("#p-dr").value.trim(),dietitian:$("#p-di").value.trim(),
      conditions:$("#p-cond").value.trim(),notes:$("#p-notes").value.trim()
    });
    {const w=num($("#p-w").value);if(w>0&&w!==HPD.currentWeight())HPD.setWeight(dkey(0),w)}
    applyProfile();close();toast("Saved");if(tab==="dash")HPD.renderDash();
  };
  $("#p-sync").onclick=async()=>{
    SYNC.state("saving");
    const ch=await SYNC.sync();
    close();if(ch)refreshAll();toast("Synced");
  };
  $("#p-out").onclick=()=>{if(confirm("Log out of this device?"))SYNC.logout(false)};
  trDom();
}

/* ---------- Health tests (lab results) ---------- */
const LABS=[["HbA1c","%"],["Fasting glucose","mg/dL"],["Post-meal glucose","mg/dL"],["TSH","mIU/L"],["Free T4","ng/dL"],["Total cholesterol","mg/dL"],["LDL","mg/dL"],["HDL","mg/dL"],["Triglycerides","mg/dL"],["Creatinine","mg/dL"],["Blood pressure","mmHg"],["Weight","kg"],["Other",""]];
function labCard(){
  const L=(store.get("labs").list||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.id||"").localeCompare(a.id||""));
  const latest={};L.forEach(x=>{if(!latest[x.test])latest[x.test]=x});
  const chips=Object.keys(latest).map(t=>`<span class="chip">${esc(t)}: <b>${esc(latest[t].value)}</b> ${esc(latest[t].unit||"")}</span>`).join("");
  let h=`<div class="card health-full"><div class="card-hd"><h3>${SVG.chart} Health tests</h3><span class="meta">${L.length}</span></div>`;
  h+=chips?`<div class="lab-chips">${chips}</div>`:`<p style="color:var(--mute);font-size:.85rem;margin:0 0 8px">No test results yet. Add your lab reports below.</p>`;
  h+=`<div class="lab-list">`;
  L.forEach(x=>{h+=`<div class="row-item"><div class="row-info"><div class="row-title">${esc(x.test)}: ${esc(x.value)} ${esc(x.unit||"")}</div><div class="row-sub">${esc(x.date||"")}${x.note?" · "+esc(x.note):""}</div></div><button class="btn-del" data-lab="${esc(x.id)}" aria-label="Remove">×</button></div>`});
  h+=`</div><div class="form-row"><select class="ctrl" id="lt">${LABS.map(l=>`<option value="${l[0]}">${l[0]}</option>`).join("")}</select><input class="ctrl" id="lv" placeholder="Value, e.g. 6.8 or 120/80" style="flex:2 1 150px"><input class="ctrl" id="lu" placeholder="Unit" value="${LABS[0][1]}" style="max-width:90px"><input class="ctrl" id="ld" type="date" value="${dkey(0)}"><input class="ctrl" id="ln" placeholder="Note (optional)" style="flex:2 1 150px"><button class="btn-primary" id="ladd">Add result</button></div></div>`;
  return h;
}
function wireLabs(done){
  const t=$("#lt");if(!t)return;
  t.onchange=()=>{const l=LABS.find(x=>x[0]===t.value);$("#lu").value=l?l[1]:""};
  $("#ladd").onclick=()=>{
    const v=$("#lv").value.trim();if(!v)return;
    const list=store.get("labs").list||[];
    list.push({id:"l"+Date.now(),test:t.value,value:v,unit:$("#lu").value.trim(),date:$("#ld").value||dkey(0),note:$("#ln").value.trim()});
    store.set("labs",{list:list});done();
  };
  document.querySelectorAll("[data-lab]").forEach(b=>b.onclick=()=>{
    store.set("labs",{list:(store.get("labs").list||[]).filter(x=>x.id!==b.dataset.lab)});done();
  });
}

/* ---------- Price list editor (Stock tab) ---------- */
function priceCard(){
  const pu={};SHOP.mon[1].forEach(g=>g[1].forEach(it=>{pu[it[0]]=parseQ(it[1]).u}));
  let h=`<details class="fam-card" style="margin-top:14px"><summary><span class="fam-sum-l">${SVG.bag}<span>Price list (₹)</span></span>${SVG.chev}</summary><div class="fam-body"><p class="sheet-sub" style="margin:10px 0 4px">Used to estimate your buy list. Weighed items are priced per kg or litre, the rest per piece.</p><div class="fam-grid">`;
  Object.keys(pu).filter(n=>PR[n]).forEach(n=>{
    h+=`<div class="row-item"><div class="row-info"><div class="row-title">${esc(n)}</div><div class="row-sub">${pu[n]?"₹ per "+(pu[n]==="g"?"kg":"litre"):"₹ each"}</div></div><div class="stp"><input type="number" inputmode="decimal" min="0" step="any" value="${PR[n][0]}" data-pn="${esc(n)}" aria-label="Price of ${esc(n)}"></div></div>`;
  });
  return h+`</div></div></details>`;
}
function wirePrices(){
  document.querySelectorAll("[data-pn]").forEach(i=>i.onchange=()=>{
    const v=Math.max(0,+i.value||0),n=i.dataset.pn,s0=store.get("prices"),p=s0.p||{};
    p[n]=v;PR[n]=[v,2];
    store.set("prices",{t:s0.t||new Date().toISOString(),p:p});
  });
}

/* ---------- Startup ---------- */
function reloadPrices(){const s0=store.get("prices");if(s0.p)for(const k in s0.p)if(PR[k])PR[k]=[s0.p[k],2]}
function boot(skipPending){
  lang=store.get("lang").v||"en";
  reloadPrices();initTheme();applyMutton();applyProfile();
  document.body.dataset.sync=SYNC.token?"idle":"";
  setLang(lang);
  if(!skipPending)checkPending();
}
function refreshAll(){
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  if($("#acct")||$("#ov"))return;
  lang=store.get("lang").v||"en";
  reloadPrices();initTheme();applyProfile();setLang(lang);
}
const syncNow=()=>SYNC.sync().then(ch=>{if(ch)refreshAll();checkPending()});

$("#acctBtn").innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
$("#acctBtn").onclick=()=>{if(SYNC.token)openAcct();else showAuth()};

(function(){const g=new URLSearchParams(location.search).get("go");if(g&&["dash","shop","meals","cook","inv","health"].includes(g)){tab=g;try{history.replaceState(null,"",location.pathname)}catch(e){}}})();
if(SYNC.token){boot(true);syncNow()}else showAuth();
document.addEventListener("visibilitychange",()=>{
  if(!SYNC.token)return;
  if(document.hidden)SYNC.flush();else syncNow();
});
window.addEventListener("online",()=>{if(SYNC.token)SYNC.sync()});
setInterval(()=>{if(!document.hidden&&SYNC.token)checkPending()},300000);
</script>
